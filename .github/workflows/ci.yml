name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Tests
        run: cargo test --all-targets --all-features

      - name: Run Privileged WG Noise Recovery Test
        run: |
          cargo build --locked --bin runnel
          test_bin="$(
            cargo test --locked --test wg_noise_e2e --no-run --message-format=json |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "wg_noise_e2e" and .executable != null) | .executable' |
              tail -n 1
          )"
          test -n "$test_bin"
          sudo env "RUNNEL_E2E_BIN=$PWD/target/debug/runnel" "$test_bin" \
            linux::wg_noise_engine_recovers_from_old_udp_source_port_blackhole \
            --ignored --nocapture

  macos:
    name: macOS
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --all-targets --all-features

      - name: Run Non-Privileged Tests
        run: cargo test --locked --all-targets --all-features
