# Sample WG IPv6-only config.
# Prefer generating a fresh config with `runnel wg-config`.
# Replace every REPLACE_WITH_* value before running.

log: info
log_file: ./logs/runnel-wg-ipv6.log
telemetry_sock: ./run/runnel-wg-ipv6.sock
tui: true

client:
  mode: wg
  adblock:
    enabled: true
    lists:
      - https://easylist.to/easylist/easylist.txt
      - https://easylist.to/easylist/easyprivacy.txt
      - https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/filters.txt
    cache_dir: ~/.cache/runnel/adblock
    update_interval_hours: 24
    decision_cache_ttl_secs: 300
    fail_open: true
  ip_rules:
    direct:
      - "fc00::/7"
      - "fe80::/10"
      - "ff00::/8"
  wg:
    engine: noise
    obfs: mask
    obfs_padding_min: 8
    obfs_padding_max: 96
    obfs_handshake_padding: 256
    obfs_response_padding: 192
    obfs_junk_packets: 0
    obfs_jitter_ms: 0
    endpoint: "[SERVER-IPv6]:1443"
    private_key: REPLACE_WITH_CLIENT_PRIVATE_KEY
    peer_public_key: REPLACE_WITH_SERVER_PUBLIC_KEY
    tunnel_ip: fd00:8::2
    peer_tunnel_ip: fd00:8::1
    mtu: 1420
    persistent_keepalive_secs: 25
    dns: 2606:4700:4700::1111
    dns_capture: true
    skip_handshake_probe: false
    # tcpdump: true
    # tcpdump_interface: any

server:
  mode: wg
  wg:
    engine: noise
    obfs: mask
    obfs_padding_min: 8
    obfs_padding_max: 96
    obfs_handshake_padding: 256
    obfs_response_padding: 192
    obfs_junk_packets: 0
    obfs_jitter_ms: 0
    listen: "[::]:1443"
    private_key: REPLACE_WITH_SERVER_PRIVATE_KEY
    peer_public_key: REPLACE_WITH_CLIENT_PUBLIC_KEY
    tunnel_ip: fd00:8::1
    peer_tunnel_ip: fd00:8::2
    mtu: 1420
    peer_allowed_ips:
      - fd00:8::2/128
    # tcpdump: true
    # tcpdump_interface: eth0
