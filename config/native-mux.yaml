# Sample native-mux config.
# Use RUNNEL_PASSWORD for the shared secret; do not commit real passwords.

log: info
log_file: ./logs/runnel-native-mux.log
telemetry_sock: ./run/runnel-native-mux.sock
tui: true

client:
  listen: 127.0.0.1:1080
  server: SERVER-IP:1443
  server_name: SERVER-NAME
  ca_cert: ./certs/server.crt
  mode: native-mux
  mux_path: /mux
  filter: proxy
  user_agent: Mozilla/5.0
  handshake_timeout_secs: 10
  connect_timeout_secs: 10
  max_header_size: 8192

server:
  listen: 0.0.0.0:1443
  cert: ./certs/server.crt
  key: ./certs/server.key
  mode: native-mux
  mux_path: /mux
  auth_window_secs: 120
  handshake_timeout_secs: 10
  connect_timeout_secs: 10
  max_header_size: 16384
  allow_private_targets: false
  fallback_url: https://example.org

cert:
  cert: ./certs/server.crt
  key: ./certs/server.key
  names:
    - SERVER-NAME

