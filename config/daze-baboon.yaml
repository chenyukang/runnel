# Sample daze-baboon config.
# Use RUNNEL_PASSWORD for the shared secret; do not commit real passwords.

log: info
log_file: ./logs/runnel-daze-baboon.log
telemetry_sock: ./run/runnel-daze-baboon.sock
tui: true

client:
  listen: 127.0.0.1:1080
  server: SERVER-IP:1081
  mode: daze-baboon
  filter: proxy
  user_agent: Mozilla/5.0
  handshake_timeout_secs: 10
  connect_timeout_secs: 10

server:
  listen: 0.0.0.0:1081
  mode: daze-baboon
  auth_window_secs: 120
  handshake_timeout_secs: 10
  connect_timeout_secs: 10
  allow_private_targets: false
  fallback_url: https://example.org
  fallback_timeout_secs: 15
  max_fallback_body_size: 1048576

