[package]
name = "pipit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
glob = "0.3"
hmac = "0.12"
hex = "0.4"
ipnet = "2"
libc = "0.2"
md5 = "0.7"
rand = "0.8"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tun2proxy = "0.7.20"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
