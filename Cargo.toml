[package]
name = "runnel-rs"
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
description = "A Rust proxy and tunnel toolbox with WireGuard-style, TUN, SOCKS, and TLS-based transports."
readme = "README.md"
repository = "https://github.com/chenyukang/runnel"
homepage = "https://github.com/chenyukang/runnel"
documentation = "https://docs.rs/runnel-rs"
license = "MIT OR Apache-2.0"
keywords = ["proxy", "tunnel", "wireguard", "socks", "vpn"]
categories = ["command-line-utilities", "network-programming"]
default-run = "runnel"
include = [
    "src/**",
    "benches/**",
    "tests/**",
    "config/**",
    "docs/**",
    "scripts/**",
    "README.md",
    "Cargo.toml",
    "Cargo.lock",
]

[lib]
name = "runnel"
path = "src/lib.rs"

[[bin]]
name = "runnel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
adblock = { version = "0.12", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
base64 = "0.22"
boringtun = { version = "0.7.0", features = ["device"] }
clap = { version = "4.5", features = ["derive", "env"] }
glob = "0.3"
getrandom = "0.3"
hmac = "0.12"
hex = "0.4"
ipnet = "2"
libc = "0.2"
md5 = "0.7"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tun2proxy = "0.7.21"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[[bench]]
name = "mode_perf"
harness = false
